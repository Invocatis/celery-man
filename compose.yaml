services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
      - "443:443"
    volumes:
      - .:/app/:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro \
      - ./.https/certs:/etc/nginx/certs
    depends_on:
      - print-server
    networks:
      - app
  print-server:
    build: ./print-server
    working_dir: /app
    volumes:
      - ./print-server:/app
      - ./sequences:/app/sequences
      - /run/cups/cups.sock:/run/cups/cups.sock
    command: bun run server.js
    expose:
      - "3000"
    networks:
      - app
networks:
  app:
    driver: bridge
