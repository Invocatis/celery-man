services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
      - "443:443"
    volumes:
      - .:/app/:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.https/certs:/etc/nginx/certs
    depends_on:
      - print-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app
  print-server:
    build: ./print-server
    working_dir: /app
    volumes:
      - ./print-server:/app
      - ./sequences:/app/sequences
      - /etc/cups/:/etc/cups/
    environment:
      CUPS_SERVER: "nginx:631"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: bun run server.js
    expose:
      - "3000"
    networks:
      - app
  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main
    ports:
      - "1234:1234"
    volumes:
      - ./models:/models
    command:
      - whisper-server
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model
      - /models/ggml-base.en.bin
      - --threads
      - "4"
    restart: unless-stopped
networks:
  app:
    driver: bridge
