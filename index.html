<html>
    <head>
        <meta charset="UTF-8" />
        <title>Cinco 2.5</title>

        <link rel="stylesheet" href="css/styles.css" />
        <link
            rel="stylesheet"
            href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.3/css/font-awesome.min.css"
        />
        <link
            href="https://fonts.googleapis.com/css?family=VT323"
            rel="stylesheet"
        />

        <script src="js/app.js"></script>
    </head>
    <body>
        <div id="desktop">
            <div class="window" id="window-welcome">
                <div class="window-titlebar">
                    <button type="button" class="btn-close" title="Close">
                        <i class="fa fa-2x fa-minus"></i>
                    </button>

                    <span class="title">Cinco Identity Generator 2.5</span>

                    <button type="button" class="btn-move" title="Move">
                        <i class="fa fa-2x fa-caret-up"></i>
                    </button>
                    <button type="button" class="btn-move" title="Move">
                        <i class="fa fa-2x fa-caret-down"></i>
                    </button>
                </div>

                <div class="window-content">
                    <img class="header" src="img/cinco.png" />
                    <div class="progress">
                        <h2>Cinco Identity Generator 2.5</h2>
                        <progress max="100" value="0"></progress>
                        <h3>Please wait...</h3>
                    </div>
                </div>
            </div>

            <div style="display: none" class="window" id="window-prompt">
                <div class="window-titlebar">
                    <button type="button" class="btn-close" title="Close">
                        <i class="fa fa-2x fa-minus"></i>
                    </button>

                    <span class="title">Paul's COMPUTER</span>

                    <button type="button" class="btn-move" title="Move">
                        <i class="fa fa-2x fa-caret-up"></i>
                    </button>
                    <button type="button" class="btn-move" title="Move">
                        <i class="fa fa-2x fa-caret-down"></i>
                    </button>
                </div>

                <div class="window-content"></div>
            </div>

            <div style="display: none" class="window" id="window-loader">
                <div class="window-titlebar">
                    <button type="button" class="btn-close" title="Close">
                        <i class="fa fa-2x fa-minus"></i>
                    </button>

                    <span class="title">Cinco Identity Generator 2.5</span>

                    <button type="button" class="btn-move" title="Move">
                        <i class="fa fa-2x fa-caret-up"></i>
                    </button>
                    <button type="button" class="btn-move" title="Move">
                        <i class="fa fa-2x fa-caret-down"></i>
                    </button>
                </div>

                <div class="window-content">
                    <progress max="100" value="0"></progress>
                    <h3>Loading, please wait...</h3>
                </div>
            </div>
        </div>

        <script>
            application.initialize();
        </script>
    </body>
</html>
