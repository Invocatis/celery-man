events {}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 8080;
    server_name _;


    location /sequences/ {

      alias /sequences/;

      autoindex on;
      autoindex_format json;

      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "no-store";
    }
  }
}
